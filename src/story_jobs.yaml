story_line_name: The Curse of the Were-Chud

stories:
  - description: |
      A local priest "Father Flumbo" has recently had to bury 5 citizens that had been killed mysteriously
      in the night. They were injured in various ways, from vape-flooded lungs to skulls that had been
      crushed by a huge fat ass. He needs someone to investigate these mysterious deaths.
    goal: |
      The chud successfully traces common clues to all these deaths to an abandoned warehouse on the
      outskirts of town.
    difficulty: 2
    reward:
      rarity: common

  - description: |
      With the creepy warehouse as the only lead, Father Flumbo needs someone to investigate the warehouse and find out what's going on.
    goal: |
      The chud successfully investigates the warehouse but doesn't find the culprit, instead they find an empty bottle of mountain dew, 
      a few empty vape pods, and a broken rosary on the ground.
    difficulty: 4
    reward:
      rarity: uncommon

  - description: |
      A local church-goer has grown concerned about Father Flumbo recently. He'll show up late to mass with huge bags under his eyes
      and with the unmistakeable smell of cheetos and olive oil. He needs someone to investigate and find out what's going on.
    goal: |
      The chud sneaks into the small apartment at the back of the church while father flumbo is away, and finds the diary of father flumbo.
      He writes that he was bitten by a fat chud while he was out doing missionary work, and writes that he has been experiencing memory loss.
    difficulty: 6
    reward:
      rarity: rare
