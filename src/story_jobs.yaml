story_line_name: The Lighthouse Letters

stories:
  - description: |
      The guild master found a sealed letter in the basement with strict instructions
      not to open it. The lighthouse keeper is expecting a delivery before the next storm.
    goal: Deliver the sealed letter to the lighthouse keeper without opening it
    difficulty: 4
    reward:
      rarity: uncommon
      stats: ["-", "7", "-"]

